[package]
name = "wasm-react"
version = "0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 's'

[dependencies]
generational-box = "0.6.2"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
paste = "1.0.15"

[dependencies.web-sys]
version = "0.3.77"
optional = true
features = [
  "Event",
  "MouseEvent",
  "FocusEvent",
  "KeyboardEvent",
  "DragEvent",
  "PointerEvent",
  "WheelEvent",
  "AnimationEvent",
  "TransitionEvent",
]

[workspace]
members = ["./examples/01-hello-world", "examples/01-hello-world"]
